[package]
name = "cloud_pinyin"
version = "0.1.0"
edition = "2024"
license = "MPL-2"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
lua = ["dep:mlua", "mlua/lua55", "mlua/module"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
mlua = { version = "0.11.4", optional = true }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0.145"
urlencoding = "2.1.3"
